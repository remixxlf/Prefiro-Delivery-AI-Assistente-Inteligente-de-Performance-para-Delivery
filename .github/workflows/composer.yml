name: Generate Composer Lock

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer:v2

    - name: Run Composer Update
      continue-on-error: true
      run: |
        composer update --no-interaction
        composer install --no-interaction

    - name: Show output if failed
      if: failure()
      run: echo 'Composer update failed!'

    - name: Commit composer.lock
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add composer.lock
        git commit -m "chore: generate composer.lock to fix Render deployment" || echo "No changes to commit"
        git push

